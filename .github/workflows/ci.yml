name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Validate Chrome reference docs
        run: npm run docs:chrome:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Print review regression formatting
        run: |
          npx prettier docs/superpowers/plans/2026-08-14-pr10-review-remediation.md
          npx prettier tests/component/pr10-review-regressions-round2.test.tsx
          npx prettier tests/unit/pr10-review-regressions-round2.test.ts

      - name: Format check
        run: npm run format:check

      - name: Unit and component tests
        run: npm test -- --run

      - name: Coverage
        run: npm run test:coverage

      - name: Workbench fixture e2e
        run: npm run test:workbench

      - name: Production extension gate
        run: npm run test:extension

      - name: Popup smoke
        run: npm run smoke:popup

      - name: Build Chrome extension
        run: npm run build

      - name: Zip Chrome package
        run: npm run zip

      - name: Scan production zip tree
        run: npm run verify:zip