name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format residual files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: fernandoyarrum/fdm-603-package-and-verify-chrome-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Format residual files
        run: npx prettier --write src/actions/executeActionPlan.ts src/controller/persistentRepairRunner.ts src/workbench/scenarios.ts tests/component/action-engine.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/actions/executeActionPlan.ts src/controller/persistentRepairRunner.ts src/workbench/scenarios.ts tests/component/action-engine.test.ts
          git commit -m "style: format residual review files"
          git push origin HEAD:fernandoyarrum/fdm-603-package-and-verify-chrome-v1
