name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Validate Chrome reference docs
        run: npm run docs:chrome:validate

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests with coverage
        run: npm run test:coverage

  chrome-integration:
    name: Chrome Integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Workbench fixture e2e
        run: npm run test:workbench

      - name: Production extension gate
        run: npm run test:extension

      - name: Popup smoke
        run: npm run smoke:popup

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-integration-diagnostics
          path: |
            .workbench/artifacts/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Zip Chrome package
        run: npm run zip

      - name: Scan production zip tree
        run: npm run verify:zip
