name: Round 5 Sol verification

on:
  push:
    branches:
      - review/round5-sol

permissions:
  contents: write

concurrency:
  group: round5-sol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Round 5 remediation verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Apply reviewed fixes
        run: python scripts/round5-patch.py

      - name: Format changed files
        run: npx prettier --write src/controller/persistentRepairRunner.ts src/persistence/requirements.ts src/persistence/startupRestore.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Round 5 regression tests
        run: npx vitest run tests/unit/pr10-review-regressions-round5.test.ts tests/unit/persistence.test.ts

      - name: Commit verified remediation
        run: |
          if git diff --quiet; then
            echo "No remediation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/controller/persistentRepairRunner.ts src/persistence/requirements.ts src/persistence/startupRestore.ts
          git commit -m "fix: address round 5 PR review findings"
          git push origin HEAD:review/round5-sol
