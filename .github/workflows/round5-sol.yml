name: Round 5 Sol verification

on:
  push:
    branches:
      - review/round5-sol

permissions:
  contents: read

concurrency:
  group: round5-sol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Round 5 focused verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Round 5 regression tests
        run: npx vitest run tests/unit/pr10-review-regressions-round5.test.ts
